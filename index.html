<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dot cube アーカイブ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader">
        <div class="water-horizon"></div>

        <div class="ripple r-1"></div>
        <div class="ripple r-2"></div>
        <div class="ripple r-3"></div>

        <div class="travel-path">
            <div class="cube-wrapper">
                <div class="cube-3d">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
                <div class="cube-3d reflection">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <header>
            <div class="header-logos">
                <img src="シンボルマーク_透明.png" alt="Icon" class="header-icon">
                <img src="dotcube_alpha.png" alt="dot cube" class="header-text-logo">
            </div>
            <p>Creaters Parade Kyushu 出展作品一覧</p>
        </header>

        <main>
            <div class="card">
                <div class="card-image-placeholder">
                    [スクリーンショット画像]
                </div>
                <div class="card-content">
                    <h2>作品タイトル</h2>
                    <div class="tags">
                        <span>#アクション</span> <span>#Unity</span>
                    </div>
                    <p>ここにはゲームの簡単な説明や、コンペでのアピールポイント、操作感などを記載します。</p>
                    <button>プレイする / 詳細を見る</button>
                </div>
            </div>
        </main>

        <footer>
            &copy; 2026 dot cube. All rights reserved.
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
