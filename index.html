<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dot cube アーカイブ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="loader">
        <div class="water-horizon"></div>

        <div class="ripple r-1"></div>
        <div class="ripple r-2"></div>
        <div class="ripple r-3"></div>

        <div class="travel-path">
            <div class="cube-wrapper">
                <div class="cube-3d">
                    <div class="face front">dot<br>cube</div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
                <div class="cube-3d reflection">
                    <div class="face front">dot<br>cube</div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <header>
            <div class="header-logos">
                <img src="シンボルマーク_透明.png" alt="Icon" class="header-icon">
                <img src="dotcube_alpha.png" alt="dot cube" class="header-text-logo">
            </div>
            <p>
                <span class="ja-text">Creaters Parade 九州 出展作品一覧</span>
            </p>
        </header>

        <main>
            <div class="filters">
                <button class="filter-btn active" onclick="filterWorks('all')">ALL</button>
                <button class="filter-btn" onclick="filterWorks('game')">GAME</button>
                <button class="filter-btn" onclick="filterWorks('music')">MUSIC</button>
                <button class="filter-btn" onclick="filterWorks('illust')">Illustration</button>
                <button class="filter-btn" onclick="filterWorks('web')">WEB</button>
            </div>

            <div class="grid" id="works-grid">
            </div>
        </main>

        <footer>
            &copy; 2026 dot cube. All rights reserved.
        </footer>

        <div class="fab-container">
            <button class="fab-main">＋</button>
            <div class="fab-menu">
                <button class="fab-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
                    title="トップへ戻る">↑</button>

                <button class="fab-btn" onclick="window.open('https://instagram.com/dotcube_m', '_blank')"
                    title="Instagram">📷</button>
                <button class="fab-btn" onclick="window.open('https://x.com/m_dotcube', '_blank')"
                    title="X (Twitter)">X</button>
                <button class="fab-btn" onclick="location.href='mailto:dotcubecrafter@gmail.com'"
                    title="Mail">✉</button>
                <button class="fab-btn" onclick="window.open('https://github.com/dot-cube', '_blank')"
                    title="GitHub">Git</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
